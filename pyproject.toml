[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thrallwright"
version = "0.1.0"
description = "A local workbench for observing and directing AI agents and their workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.13.3,<4"]

[project.scripts]
thrallwright = "thrallwright.__main__:main"

[tool.setuptools.packages.find]
include = ["thrallwright*"]

[tool.setuptools.package-data]
thrallwright = ["static/*", "static/vendor/*"]
