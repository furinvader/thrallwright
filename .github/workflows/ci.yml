name: Checks
on:
  pull_request:
  push:
    branches: [main, feat/bootstrap-workspace]
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm install
      - run: python -m pip install -e .
      - run: python -m compileall -q thrallwright scripts tests
      - run: python -m unittest discover -s tests -v
      - run: npm run check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm install
      - run: python -m pip install -e . playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser-smoke.py
